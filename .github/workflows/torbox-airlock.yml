name: torbox-airlock

# CRON DESACTIVADO (2026-09-03, dev 1). Dos razones:
#   1. Falta el secret TORBOX_API_KEY en GitHub → el job fallaba en rojo TODOS los días
#      ("Falta TORBOX_API_KEY", exit 1) sin llegar a tocar nada. Ruido de alerta puro.
#   2. Aunque estuviera el secret: el endpoint de escritura (PUT /api/torrents/edittorrent
#      {airlocked:true}) NUNCA se ejerció con un candidato real (ver CLAUDE.md sesión 2026-09-03,
#      bloque D de dev 2 — solo se verificó el read /api/torrents/mylist). Auto-correr --apply a
#      diario sobre un write no probado es riesgoso.
# Para reactivar: (a) Pablo agrega TORBOX_API_KEY como repo secret, (b) alguien corre el script
# con --apply UNA vez a mano cuando haya un candidato y confirma la respuesta cruda del PUT,
# (c) descomentar el bloque `schedule` de abajo.
# Mientras tanto queda solo con workflow_dispatch (disparo manual).

on:
  # schedule:
  #   - cron: '45 10 * * *'   # 07:45 ART, 15 min después de tatort-subs-prewarm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  airlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Airlock de contenido cacheado en progreso
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          TORBOX_API_KEY="${{ secrets.TORBOX_API_KEY }}" \
          node scripts/torbox-airlock.mjs --apply 2>&1 | tee /tmp/airlock-output.txt

      - name: Registrar en el log interno
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/log-status.mjs torbox-airlock ok < /tmp/airlock-output.txt
          git add data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore(log): torbox-airlock $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
