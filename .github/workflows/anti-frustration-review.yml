name: anti-frustration-review

on:
  schedule:
    - cron: '0 15 * * 0'   # domingos ~12:00 Argentina (UTC-3) — revisión semanal
  workflow_dispatch:          # disparo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar títulos pendientes
        id: review
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/anti-frustration.mjs review 2>&1 | tee /tmp/review-output.txt

      - name: Commitear el log actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/anti-frustration-log.json
          git diff --cached --quiet || git commit -m "chore(anti-frustration): actualizar log semanal"
          git diff --cached --quiet || git push

      - name: Enviar email con el resumen
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: pabloeckert@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[MejoraStremio] Revisión semanal antifrustración"
          to: pabloeckert@gmail.com
          from: "MejoraStremio <pabloeckert@gmail.com>"
          body: file:///tmp/review-output.txt
