name: check-account

# Disparo manual, de un solo uso: health-check.mjs + watch-log.mjs contra stremiojn o solotveg,
# para decidir con datos reales (no suposiciones) qué addons nuevos del hub instalar en cada una.
# Solo lee, no escribe nada.

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Cuenta a chequear'
        type: choice
        options:
          - jn
          - teen
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Health-check (jn)
        if: inputs.account == 'jn'
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL_JN }}" \
          ST_PASS="${{ secrets.STREMIO_PASS_JN }}" \
          node scripts/health-check.mjs

      - name: Watch-log (jn)
        if: inputs.account == 'jn'
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL_JN }}" \
          ST_PASS="${{ secrets.STREMIO_PASS_JN }}" \
          node scripts/watch-log.mjs

      - name: Health-check (teen)
        if: inputs.account == 'teen'
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL_TEEN }}" \
          ST_PASS="${{ secrets.STREMIO_PASS_TEEN }}" \
          HEALTH_CHECK_SEARCH_PROBE="cars" \
          node scripts/health-check.mjs

      - name: Watch-log (teen)
        if: inputs.account == 'teen'
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL_TEEN }}" \
          ST_PASS="${{ secrets.STREMIO_PASS_TEEN }}" \
          node scripts/watch-log.mjs
