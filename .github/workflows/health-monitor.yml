name: health-monitor

on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 Argentina (UTC-3)
    - cron: '0 0 * * *'    # 21:00 Argentina (UTC-3)
  workflow_dispatch:         # disparo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — ver el comentario en daily-catalog-refresh.yml (mismo motivo: un shallow
      # clone rompe "git pull --rebase origin main" si hay commits reales que reconciliar).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Health check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/health-check.mjs 2>&1 | tee /tmp/health-output.txt

      - name: Registrar en el log interno
        if: always()
        run: |
          STATUS="ok"; [ "${{ steps.check.outcome }}" != "success" ] && STATUS="error"
          node scripts/log-status.mjs health-monitor "$STATUS" < /tmp/health-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore(log): health-monitor $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Fallar job si health check falló
        if: always() && steps.check.outcome == 'failure'
        run: |
          echo "Health check falló — ver data/internal-log.jsonl o el output de arriba"
          exit 1
