name: debug-tatort-meta

# Disparo manual, de un solo uso: diagnose-tatort.mjs encontró que Cinemeta solo lista 14
# episodios totales para Tatort — este workflow vuelca la lista cruda para entender por qué.
# Sin credenciales (Cinemeta es público).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Volcar metadata cruda de Tatort
        run: node scripts/debug-tatort-meta.mjs
