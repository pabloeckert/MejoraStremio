name: premiere-radar

# 07:15 Argentina (UTC-3) — 15 min después de daily-catalog-refresh (mismo horario base) para
# evitar que ambos jobs compitan por el mismo push a data/.
on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — ver el comentario en daily-catalog-refresh.yml (mismo motivo: un shallow
      # clone rompe "git pull --rebase origin main" si hay commits reales que reconciliar).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chequear próximos episodios
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/premiere-radar.mjs 2>&1 | tee /tmp/radar-output.txt

      - name: Commitear el estado y registrar en el log interno
        run: |
          bash scripts/lib/ci-commit-push.sh \
            "chore(premiere-radar): actualizar estado diario" \
            premiere-radar ok /tmp/radar-output.txt \
            data/premiere-radar-state.json
