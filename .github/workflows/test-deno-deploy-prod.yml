name: test-deno-deploy-prod

# Disparo manual, de un solo uso: retest de --prod contra el CLI de Deno Deploy actual.
#
# Primer intento (con deno.jsonc todavía con "prod": true en su sección "deploy") CONFIRMÓ la
# causa raíz real del bug documentado desde 2026-08-29: el CLI convierte "prod": true del config
# en un --prod implícito, y pasar --prod también en la línea de comando lo duplica ("Option
# "--prod" can only occur once, but was found several times"). Se sacó "prod": true de
# deno.jsonc — este segundo intento prueba si --prod explícito ya funciona limpio sin esa
# duplicación (que es, según la doc oficial, el mecanismo real para deployar a producción).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Deno CLI
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- --yes
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Version y config actual
        run: |
          deno --version
          echo "--- deno.jsonc ---"
          cat deno.jsonc
      - name: Test 1 -- deno deploy --prod
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          echo "::group::deno deploy --prod"
          deno deploy --prod || echo "EXIT CODE: $?"
          echo "::endgroup::"
        continue-on-error: true
