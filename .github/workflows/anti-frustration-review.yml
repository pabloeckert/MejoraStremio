name: anti-frustration-review

on:
  schedule:
    - cron: '0 15 * * 0'   # domingos ~12:00 Argentina (UTC-3) — revisión semanal
  workflow_dispatch:          # disparo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar títulos pendientes
        id: review
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/anti-frustration.mjs review 2>&1 | tee /tmp/review-output.txt

      - name: Commitear el log y registrar en el log interno
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/log-status.mjs anti-frustration-review ok < /tmp/review-output.txt
          git add data/anti-frustration-log.json data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git pull --rebase origin main
            git commit -m "chore(anti-frustration): actualizar log semanal"
            git push
          fi
