name: diagnose-tatort

# Disparo manual, de un solo uso: Pablo pidió esfuerzo máximo para conseguir Tatort (tt0806910)
# en alemán con subtítulos español latino, últimos 10 años como mínimo. Muestrea episodios
# recientes y prueba streams + subtítulos reales contra la cuenta real antes de decidir qué hacer.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Cuántos años hacia atrás muestrear'
        type: string
        default: '10'
      sample_per_year:
        description: 'Cuántos episodios probar por año'
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar Tatort
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/diagnose-tatort.mjs "${{ github.event.inputs.years }}" "${{ github.event.inputs.sample_per_year }}"
