name: check-preview-latino

# Disparo manual, de un solo uso: verifica la ruta nueva /opensubtitles-latino (código "ea") contra
# el build de PREVIEW recién deployado de mejorastremio-hub (deploy-deno-hub.yml quedó, de nuevo,
# como preview y no como producción — mismo patrón ya documentado en la sesión 2026-08-29). Pasar
# la URL de preview completa como input antes de pedirle a Pablo que la promueva a producción.

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL base del preview (sin barra final), ej. https://mejorastremio-hub-XXXX.pabloeckert.deno.net'
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probar /opensubtitles-latino contra el preview
        run: |
          set -x
          BASE="${{ github.event.inputs.preview_url }}"
          echo "--- /health ---"
          curl -sS "$BASE/health" || true
          echo
          echo "--- /opensubtitles-latino/manifest.json ---"
          curl -sS "$BASE/opensubtitles-latino/manifest.json" || true
          echo
          echo "--- /opensubtitles-latino/subtitles/movie/tt0110912.json (Matrix) ---"
          curl -sS "$BASE/opensubtitles-latino/subtitles/movie/tt0110912.json" || true
          echo
