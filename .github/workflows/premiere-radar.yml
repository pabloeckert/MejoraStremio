name: premiere-radar

# 07:15 Argentina (UTC-3) — 15 min después de daily-catalog-refresh (mismo horario base) para
# evitar que ambos jobs compitan por el mismo push a data/.
on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chequear próximos episodios
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/premiere-radar.mjs 2>&1 | tee /tmp/radar-output.txt

      - name: Commitear el estado y registrar en el log interno
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/log-status.mjs premiere-radar ok < /tmp/radar-output.txt
          git add data/premiere-radar-state.json data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore(premiere-radar): actualizar estado diario"
            git pull --rebase origin main
            git push
          fi
