name: daily-catalog-refresh

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 Argentina (UTC-3) — antes del health-check de las 09:00
  workflow_dispatch:          # disparo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (historia completa, no el shallow clone por defecto) — un checkout shallow
      # rompe "git pull --rebase origin main" más abajo cuando hay commits para reconciliar (sin
      # historia compartida, git no puede resolver el merge-base y todo archivo modificado en
      # ambos lados aparece como conflicto "add/add", aunque el contenido no choque de verdad).
      # Encontrado el 2026-08-28 al disparar este workflow manualmente contra una rama de trabajo
      # divergente — el mismo riesgo existe en frío, aunque más raro, si dos de los 4 workflows que
      # commitean a data/ llegan a correr casi al mismo tiempo sobre main (ver CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar resumen
        run: echo "MejoraStremio — refresh diario $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/summary.txt

      - name: Refrescar fechas (En Cartelera / Próximos Estrenos)
        run: |
          node scripts/refresh-dates.mjs 2>&1 | tee -a /tmp/summary.txt

      - name: Detectar si preset.json cambió
        id: diff
        run: |
          if git diff --quiet -- data/preset.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Regenera la instancia de AIOMetadata en ElfHosted y la aplica a la cuenta real cuando
      # refresh-dates.mjs efectivamente movió la ventana de fechas (ver CLAUDE.md → "AIOMetadata
      # — reconstruir/editar la instancia"), O cuando el run se disparó a mano (workflow_dispatch)
      # — un dispatch manual significa "aplicá esto ahora", y "changed" solo detecta si
      # refresh-dates.mjs hizo cambios EN ESTA corrida, no si el preset.json ya commiteado
      # (ej. un catálogo nuevo agregado antes de disparar) difiere de lo que está aplicado en la
      # cuenta real — sin el OR, un dispatch manual el mismo día que ya corrió el cron se salta el
      # regen en silencio (encontrado el 2026-08-28 al disparar esto para aplicar un catálogo
      # nuevo — el health-check daba verde pero el catálogo nunca llegó a la cuenta real). Cada
      # corrida exitosa crea un UUID nuevo en ElfHosted; no hay endpoint para borrar los viejos,
      # es una limitación conocida.
      - name: Regenerar y aplicar AIOMetadata
        id: regen
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -o pipefail
          AIO_PASSWORD="${{ secrets.AIO_PASSWORD }}" \
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/regenerate-aiometadata.mjs --apply 2>&1 | tee -a /tmp/summary.txt

      - name: Auditar orden de catálogos
        id: audit
        continue-on-error: true
        run: node scripts/audit-catalog-order.mjs 2>&1 | tee -a /tmp/summary.txt

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/health-check.mjs 2>&1 | tee -a /tmp/summary.txt

      # Instancia propia de solotveg (perfil juvenil, ver cuentas/solotveg/CLAUDE.md): reordena/
      # filtra igual que regenerate-aiometadata.mjs pero con ageRating=PG-13 y sin país/región/
      # rating en Home. Corre siempre que preset.json cambió (misma condición que la instancia
      # compartida, porque lee las mismas fechas de Estrenos/Cartelera).
      - name: Regenerar y aplicar AIOMetadata (solotveg)
        id: regen_teen
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -o pipefail
          AIO_PASSWORD="${{ secrets.AIO_PASSWORD }}" \
          ST_EMAIL_TEEN="${{ secrets.STREMIO_EMAIL_TEEN }}" \
          ST_PASS_TEEN="${{ secrets.STREMIO_PASS_TEEN }}" \
          node scripts/regenerate-aiometadata-solotveg.mjs --apply 2>&1 | tee -a /tmp/summary.txt

      - name: Health check (solotveg)
        id: health_teen
        continue-on-error: true
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL_TEEN }}" \
          ST_PASS="${{ secrets.STREMIO_PASS_TEEN }}" \
          HEALTH_CHECK_SEARCH_PROBE="cars" \
          node scripts/health-check.mjs 2>&1 | tee -a /tmp/summary.txt

      - name: Commitear preset.json / instancia solotveg si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/preset.json cuentas/solotveg/aiometadata-instance.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(preset): refresh diario de fechas/catálogos"
            git pull --rebase origin main
            git push
          fi

      - name: Subir backup como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-refresh-backup-${{ github.run_id }}
          path: .backups/
          retention-days: 14
          if-no-files-found: ignore

      - name: Decidir resultado
        id: meta
        if: always()
        run: |
          FAIL="false"
          [ "${{ steps.regen.outcome }}" = "failure" ] && FAIL="true"
          [ "${{ steps.health.outcome }}" = "failure" ] && FAIL="true"
          [ "${{ steps.regen_teen.outcome }}" = "failure" ] && FAIL="true"
          [ "${{ steps.health_teen.outcome }}" = "failure" ] && FAIL="true"
          echo "failed=$FAIL" >> "$GITHUB_OUTPUT"

      - name: Registrar en el log interno
        if: always()
        run: |
          STATUS="ok"; [ "${{ steps.meta.outputs.failed }}" = "true" ] && STATUS="error"
          node scripts/log-status.mjs daily-catalog-refresh "$STATUS" < /tmp/summary.txt
          git add data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore(log): daily-catalog-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Fallar el job si algo salió mal
        if: always() && steps.meta.outputs.failed == 'true'
        run: exit 1
