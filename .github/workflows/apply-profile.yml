name: apply-profile

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Cuenta a aplicar (eg, stremiojn, solotveg)'
        type: choice
        options:
          - eg
          - stremiojn
          - solotveg
        required: true
        default: 'eg'
      apply:
        description: 'Aplicar en producción (true = mutación atómica en Stremio API, false = dry-run)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar Gestor de Perfil
        env:
          ST_EMAIL: ${{ secrets.STREMIO_EMAIL }}
          ST_PASS: ${{ secrets.STREMIO_PASS }}
          ST_EMAIL_EG: ${{ secrets.STREMIO_EMAIL }}
          ST_PASS_EG: ${{ secrets.STREMIO_PASS }}
          ST_EMAIL_TEEN: ${{ secrets.STREMIO_EMAIL_TEEN }}
          ST_PASS_TEEN: ${{ secrets.STREMIO_PASS_TEEN }}
          ST_EMAIL_JN: ${{ secrets.STREMIO_EMAIL_JN }}
          ST_PASS_JN: ${{ secrets.STREMIO_PASS_JN }}
        run: |
          set -o pipefail
          APPLY_FLAG=""
          [ "${{ inputs.apply }}" = "true" ] && APPLY_FLAG="--apply"
          node scripts/apply-stremioeg-profile.mjs --account "${{ inputs.account }}" $APPLY_FLAG

      - name: Subir backups atómicos como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-backups-${{ github.run_id }}
          path: .backups/
          retention-days: 14
          if-no-files-found: ignore
