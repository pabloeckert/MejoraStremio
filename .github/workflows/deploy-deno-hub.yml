name: deploy-deno-hub

# Redeploya scripts/deno-hub.ts (la app "mejorastremio-hub" en Deno Deploy) desde un runner de
# GitHub Actions, que sí tiene salida de red a deno.land/api de Deno Deploy — a diferencia de las
# sesiones de Claude Code en contenedores con esa salida bloqueada (ver CLAUDE.md, varias sesiones
# de agosto 2026). Solo disparo manual: un deploy es una acción deliberada, nunca automática.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Deno CLI
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- --yes
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Deployar mejorastremio-hub
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno --version
          # Cada flag que se agregó (--org/--app, --prod, --json) salió "duplicado" pese a no
          # estar en deno.jsonc ni pasado dos veces — el CLI parece autocompletar todos esos
          # valores solo (org/app desde deno.jsonc, prod/json/non-interactive detectados del
          # entorno CI de GitHub Actions) y cualquier flag explícito choca con el que ya inyectó.
          # Probando sin ningún flag.
          deno deploy

      - name: Verificar /short-series y /miniseries en vivo
        run: |
          sleep 5
          echo "--- /health ---"
          curl -sS https://mejorastremio-hub.pabloeckert.deno.net/health || true
          echo
          echo "--- /short-series/manifest.json ---"
          curl -sS https://mejorastremio-hub.pabloeckert.deno.net/short-series/manifest.json || true
          echo
          echo "--- /miniseries/manifest.json ---"
          curl -sS https://mejorastremio-hub.pabloeckert.deno.net/miniseries/manifest.json || true
