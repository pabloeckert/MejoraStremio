name: torbox-airlock

# CRON REACTIVADO (2026-09-04, a pedido explícito de Pablo — "revertir se puede siempre, y en
# definitiva es una mejora"). Historial: estuvo desactivado por falta del secret TORBOX_API_KEY +
# el endpoint de escritura (PUT /api/torrents/edittorrent {airlocked:true}) sin ejercerse con un
# candidato real. Secret cargado el 2026-09-04; lado de lectura (GET /api/torrents/mylist, 261
# torrents, campos OK) y el propio --apply corridos a mano ese mismo día sin errores (0 candidatos
# ese día — el guard `shows.size === 0` de la sesión 2026-09-03 evita que un fallo silencioso de
# MyTrakt borre el estado). El write en sí sigue sin un caso real que lo dispare todavía; el cron
# diario es justamente lo que lo va a ejercer la primera vez que aparezca un candidato — revisar
# data/internal-log.jsonl después de esa corrida para confirmar que la respuesta cruda del PUT es
# la esperada. Si algo sale mal, es reversible: comentar el bloque `schedule` de vuelta.

on:
  schedule:
    - cron: '45 10 * * *'   # 07:45 ART, 15 min después de tatort-subs-prewarm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  airlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Airlock de contenido cacheado en progreso
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          TORBOX_API_KEY="${{ secrets.TORBOX_API_KEY }}" \
          node scripts/torbox-airlock.mjs --apply 2>&1 | tee /tmp/airlock-output.txt

      - name: Registrar en el log interno
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/log-status.mjs torbox-airlock ok < /tmp/airlock-output.txt
          git add data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore(log): torbox-airlock $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
