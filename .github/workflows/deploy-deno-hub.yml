name: deploy-deno-hub

# Redeploya scripts/deno-hub.ts (la app "mejorastremio-hub" en Deno Deploy) desde un runner de
# GitHub Actions, que sí tiene salida de red a deno.land/api de Deno Deploy — a diferencia de
# entornos de ejecución restringidos o contenedores con salida bloqueada (ver GEMINI.md, sesiones
# de agosto 2026). Solo disparo manual: un deploy es una acción deliberada, nunca automática.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Deno CLI
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- --yes
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Deployar mejorastremio-hub
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::DENO_DEPLOY_TOKEN no configurado en Secrets."
            exit 1
          fi
          deno --version
          echo "DENO_DEPLOY_TOKEN length: ${#DENO_DEPLOY_TOKEN}"
          # En runner de GitHub Actions este comando deploya a PREVIEW si no se promueve a prod.
          # Para deploy a prod directo: deno deploy --prod --org=pabloeckert --app=mejorastremio-hub
          deno deploy

      - name: Verificar endpoints de producción en vivo (Zero Trust)
        run: |
          echo "Esperando 5s para estabilización del deploy..."
          sleep 5
          echo "--- /health ---"
          curl -fsS --retry 3 --retry-delay 3 https://mejorastremio-hub.pabloeckert.deno.net/health
          echo
          echo "--- /opensubtitles-latino/manifest.json ---"
          curl -fsS --retry 3 --retry-delay 3 https://mejorastremio-hub.pabloeckert.deno.net/opensubtitles-latino/manifest.json > /dev/null
          echo "✓ OpenSubtitles Latino OK"
          echo "--- /subdl/manifest.json ---"
          curl -fsS --retry 3 --retry-delay 3 https://mejorastremio-hub.pabloeckert.deno.net/subdl/manifest.json > /dev/null
          echo "✓ SubDL OK"
          echo "--- /short-series/manifest.json ---"
          curl -fsS --retry 3 --retry-delay 3 https://mejorastremio-hub.pabloeckert.deno.net/short-series/manifest.json > /dev/null
          echo "✓ Short Series OK"
          echo "--- /miniseries/manifest.json ---"
          curl -fsS --retry 3 --retry-delay 3 https://mejorastremio-hub.pabloeckert.deno.net/miniseries/manifest.json > /dev/null
          echo "✓ Miniseries OK"
