name: keep-warm-aiometadata

on:
  schedule:
    # Cada 20 minutos. GitHub Actions garantiza ejecución pero con margen de ~1-2 min.
    - cron: '*/20 * * * *'
  workflow_dispatch: # permite lanzar manualmente desde el tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping instancias de AIOMetadata (compartida + por cuenta)
        run: |
          FAILED=0
          ping_instance() {
            local LABEL="$1" ID="$2"
            local URL="https://aiometadata.elfhosted.com/stremio/${ID}/manifest.json"
            echo "Pinging (${LABEL}): $URL"
            START_MS=$(date +%s%3N)
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL")
            END_MS=$(date +%s%3N)
            echo "HTTP ${HTTP_STATUS} en $((END_MS - START_MS))ms"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "ERROR: ${LABEL} respondió HTTP $HTTP_STATUS — instancia caída o UUID cambiado"
              FAILED=1
            fi
          }

          SHARED_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/preset.json','utf8')).aioMetadataConfig.instanceId)")
          ping_instance "compartida (stremioeg/stremiojn)" "$SHARED_ID"

          # Instancias propias por cuenta: cuentas/*/aiometadata-instance.json (ver cuentas/solotveg/)
          for f in cuentas/*/aiometadata-instance.json; do
            [ -f "$f" ] || continue
            ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$f','utf8')).instanceId)")
            ping_instance "$(dirname "$f")" "$ID"
          done

          [ "$FAILED" = "0" ] && echo "OK — todas las instancias calientes" || exit 1
