name: anti-frustration-review

on:
  schedule:
    - cron: '0 15 * * 0'   # domingos ~12:00 Argentina (UTC-3) — revisión semanal
  workflow_dispatch:          # disparo manual desde la pestaña Actions
    inputs:
      add_imdb_id:
        description: >-
          Opcional: IMDb id de un título nuevo a registrar (ej. tt1710308) antes de la
          revisión semanal normal. Dejar vacío en el cron automático.
        type: string
        default: ''
      add_type:
        description: 'Tipo del título a registrar (solo si add_imdb_id no está vacío)'
        type: choice
        options: ['movie', 'series']
        default: 'series'
      add_season:
        description: 'Temporada (solo series, opcional)'
        type: string
        default: ''
      add_episode:
        description: 'Episodio (solo series, opcional)'
        type: string
        default: ''
      add_title:
        description: 'Título legible para el log (opcional, se usa el de Cinemeta si se deja vacío)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — ver el comentario en daily-catalog-refresh.yml (mismo motivo: un shallow
      # clone rompe "git pull --rebase origin main" si hay commits reales que reconciliar).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar título nuevo (opcional, solo si add_imdb_id se pasó en el disparo manual)
        if: github.event.inputs.add_imdb_id != ''
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/anti-frustration.mjs add \
            "${{ github.event.inputs.add_imdb_id }}" \
            "${{ github.event.inputs.add_type }}" \
            "${{ github.event.inputs.add_season }}" \
            "${{ github.event.inputs.add_episode }}" \
            "${{ github.event.inputs.add_title }}" \
            2>&1 | tee /tmp/add-output.txt

      - name: Revisar títulos pendientes
        id: review
        run: |
          set -o pipefail
          ST_EMAIL="${{ secrets.STREMIO_EMAIL }}" \
          ST_PASS="${{ secrets.STREMIO_PASS }}" \
          node scripts/anti-frustration.mjs review 2>&1 | tee /tmp/review-output.txt

      - name: Commitear el log y registrar en el log interno
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/log-status.mjs anti-frustration-review ok < /tmp/review-output.txt
          git add data/anti-frustration-log.json data/internal-log.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore(anti-frustration): actualizar log semanal"
            git pull --rebase origin main
            git push
          fi
